name: CI

# Article 7: CI always green. Red CI is a stop signal for everything else.
# ADR-0003: a phase closes only on a green run from a fresh clone.
# ADR-0005: actions are pinned by commit SHA, not by mutable tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clone-guard:
    name: clone guard (fresh-clone integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: No tracked file under .gitignore
        run: |
          bad=$(git ls-files -i -c --exclude-standard)
          if [ -n "$bad" ]; then
            echo "::error::tracked files are ignored by .gitignore — a fresh clone would lose them:"
            echo "$bad"
            exit 1
          fi
      - name: Editable install leaves the tree clean
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the working tree is dirty after an editable install — generated files are tracked:"
            git status --porcelain
            exit 1
          fi

  lint:
    name: lint (ruff + black + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests tools
      - name: black --check
        run: black --check src tests tools
      - name: mypy
        run: mypy src/caissa

      - name: silence-guard (no step may swallow a failure)
        # Session 0006: `|| true` turned a red labeling step into a green run. The guard fails the
        # build on any unexplained swallow; exemptions live in tests/silence_guard_allowlist.txt
        # with a written reason. Run it explicitly here so the guard is VISIBLE in the run log,
        # not merely implied by `pytest` passing.
        run: pytest -q tests/unit/test_ci_silence_guard.py

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (unit + golden + property)
        run: pytest -q -m "not network"

  smoke:
    name: smoke (tiny model, CPU)
    runs-on: ubuntu-latest
    needs: [clone-guard, lint, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: make smoke (CPU, <=10 min, 1000 moves 100% legal)
        run: make smoke
