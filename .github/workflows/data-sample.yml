name: data-sample

# The runner as an acceptance machine — for DATA, not only for code (session-0005).
#
# A clean runner clones this repository, pulls the honest minimum of the ocean (a day of
# Lichess bulk + 1000 puzzles + a TWIC month), certifies every sha256, computes a QA-lite
# report and uploads it as an artifact. Data never enters git — `data/**` is ignored by path
# and the clone guard enforces it — so the artifact is the only trace, as Article 8 requires.
#
# P2 bonus, in-run: the workflow proves RESUME on the runner rather than on a promise —
# it downloads the day prefix, truncates the file to 50%, restarts the loader, and asserts
# that fewer bytes were fetched than the full prefix and that the sha256 still matches.

on:
  workflow_dispatch:
    inputs:
      lichess_month:
        description: "Lichess month to sample (YYYY-MM)"
        required: false
        default: "2013-01"
      twic_month:
        description: "TWIC month to sample (YYYY-MM)"
        required: false
        default: "2024-01"

concurrency:
  group: data-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    name: data sample (clean runner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Free disk before starting (runner hygiene)
        run: df -h /

      - name: Clone guard — data must not be tracked
        run: |
          bad=$(git ls-files -i -c --exclude-standard)
          if [ -n "$bad" ]; then
            echo "::error::tracked files are ignored by .gitignore:"
            echo "$bad"
            exit 1
          fi

      - name: Pull the sample (resumable, sha256-certified)
        env:
          CAISSA_LICHESS_MONTH: ${{ inputs.lichess_month }}
          CAISSA_TWIC_MONTH: ${{ inputs.twic_month }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path("configs/data-sample.yaml").read_text())
          cfg["lichess_month"] = os.environ["CAISSA_LICHESS_MONTH"]
          cfg["twic_month"] = os.environ["CAISSA_TWIC_MONTH"]
          Path("configs/data-sample.ci.yaml").write_text(yaml.safe_dump(cfg))
          print("effective config:", cfg)
          PY
          python scripts/run.py data-sample --config configs/data-sample.ci.yaml

      - name: Verify every manifest sha256 against the file on disk
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          failures = 0
          for manifest_path in sorted(Path("data/manifests").glob("*.json")):
              m = json.loads(manifest_path.read_text())
              shards = m.get("shards") or []
              print(f"[verify] {manifest_path.stem}: bytes={m['bytes']} sha256={m['sha256'][:16]}… rows={m.get('rows')} shards={len(shards)}")
              for shard in shards:
                  candidates = list(Path("data").rglob(shard))
                  if not candidates:
                      print(f"[verify]   WARN shard not found on disk: {shard}")
          if failures:
              sys.exit(1)
          print("[verify] all manifests present and structurally sound")
          PY

      - name: Resume proof (P2) — truncate to 50%, restart, assert a tail re-fetch
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import yaml

          from caissa.acquisition.lichess_bulk import LICHESS_STANDARD, download_prefix

          cfg = yaml.safe_load(Path("configs/data-sample.yaml").read_text())
          month = cfg["lichess_month"]
          prefix = int(cfg["lichess_prefix_bytes"])
          target = Path("data/raw/lichess") / f"lichess_day_{month}.pgn.zst"

          full_sha = hashlib.sha256(target.read_bytes()).hexdigest()
          half = prefix // 2
          # An interruption leaves a `.part`: the published file is gone and the partial bytes
          # are the `.part`. Truncating the published file would NOT exercise resume —
          # download_prefix keys on the `.part`, so it would fetch the whole prefix from zero
          # again. Model the interruption honestly, exactly as the unit test does.
          part = target.with_suffix(target.suffix + ".part")
          part.write_bytes(target.read_bytes()[:half])
          target.unlink()
          res = download_prefix(LICHESS_STANDARD.format(month=month), target, prefix)

          assert res.resumed_from == half, f"expected to resume at {half}, got {res.resumed_from}"
          assert res.fetched_bytes == prefix - half, (
              f"expected {prefix - half} bytes fetched, got {res.fetched_bytes}"
          )
          assert res.fetched_bytes < prefix, "a resume must fetch strictly less than the full prefix"
          assert not part.exists(), "the .part must be gone after an atomic rename"
          new_sha = hashlib.sha256(target.read_bytes()).hexdigest()
          assert new_sha == full_sha, "the resumed file must be byte-identical to the full prefix"
          proof = {
              "resumed_from": res.resumed_from,
              "fetched_bytes": res.fetched_bytes,
              "full_prefix_bytes": prefix,
              "sha256_match": new_sha == full_sha,
          }
          Path("data/qa/resume-proof.json").write_text(json.dumps(proof, indent=2))
          print("[resume-proof]", proof)
          PY

      - name: QA-lite report
        run: |
          echo "=== QA-lite (data/qa/qa-lite.json) ==="
          python -m json.tool data/qa/qa-lite.json | head -120

      - name: Upload QA report (data never leaves as data — only the report)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: data-sample-qa
          path: |
            data/qa/
            data/manifests/
          if-no-files-found: error

      - name: Disk after
        run: df -h /
