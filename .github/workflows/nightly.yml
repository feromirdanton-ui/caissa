name: Nightly integration

# Heavier checks that are too slow for every push: property tests over many
# random positions, the golden suite, and (when a Stockfish binary is present)
# the arena stub. Network tests are opt-in and never block the main CI.
# ADR-0005: actions are pinned by commit SHA, not by mutable tag.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  integration:
    name: integration (property + golden + arena stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Property tests (random positions)
        run: pytest -q tests/property -m "not network"
      - name: Golden suite (incl. Requiem-1)
        run: pytest -q tests/golden
      - name: Arena stub report
        run: make eval
      - name: Upload reports
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: nightly-reports
          path: LOG/
          if-no-files-found: ignore
