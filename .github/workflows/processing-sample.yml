name: processing-sample

# The runner as an acceptance machine — for PROCESSING (session-0006, Phase 2).
#
# A clean runner takes the data-sample artifact (or re-pulls the honest minimum), runs the
# Phase 2 pipeline over it — stream -> filter (ADR-0010) -> dedup -> shard to jsonl.zst -> QA
# report — and uploads the shards' QA report as an artifact. Data never enters git: `data/**`
# is ignored by path and the clone guard enforces it (Article 8).
#
# Honest scale: the day-prefix is ~57k games, not the 1M of the Phase 2 DoD. The workflow
# records the real count and the deviation is stated in LOG/session-0006.md — a small honest
# dataset beats a silent truncation, and both beat a fabricated volume (Article 5).

on:
  workflow_dispatch:
    inputs:
      lichess_month:
        description: "Lichess month to sample (YYYY-MM)"
        required: false
        default: "2013-01"
      shard_size:
        description: "games per shard"
        required: false
        default: "10000"

concurrency:
  group: processing-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process:
    name: processing sample (clean runner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Clone guard — data must not be tracked
        run: |
          bad=$(git ls-files -i -c --exclude-standard)
          if [ -n "$bad" ]; then
            echo "::error::tracked files are ignored by .gitignore:"
            echo "$bad"
            exit 1
          fi

      - name: Pull the honest minimum (day of Lichess bulk)
        env:
          CAISSA_LICHESS_MONTH: ${{ inputs.lichess_month }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path("configs/data-sample.yaml").read_text())
          cfg["lichess_month"] = os.environ["CAISSA_LICHESS_MONTH"]
          Path("configs/data-sample.ci.yaml").write_text(yaml.safe_dump(cfg))
          print("effective config:", cfg)
          PY
          python scripts/run.py data-sample --config configs/data-sample.ci.yaml

      - name: Run the Phase 2 pipeline (stream -> filter -> dedup -> shard -> QA)
        run: |
          python scripts/run.py processing \
            --pgn data/raw/lichess/lichess_day_${{ inputs.lichess_month }}.pgn.zst \
            --out data/shards \
            --qa data/qa/processing.json \
            --shard-size ${{ inputs.shard_size }} \
            --truncated-ok

      - name: Blunder labeling (Stockfish when present, else MOCK — labeled)
        # No `|| true`: a labeling failure must fail the run. Masking it would be a
        # silent false success — the exact class Article 5 forbids.
        run: |
          python scripts/run.py label \
            --pgn data/raw/lichess/lichess_day_${{ inputs.lichess_month }}.pgn.zst \
            --limit 10000 \
            --engine auto \
            --qa data/qa/labels.json
          echo "=== labels (head) ==="
          python -m json.tool data/qa/labels.json | head -40

      - name: Verify every shard sha256 against the file on disk
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          qa = json.loads(Path("data/qa/processing.json").read_text())
          failures = 0
          for shard in qa["shards"]:
              path = Path("data/shards") / shard["name"]
              if not path.exists():
                  print(f"::error::shard missing: {path}")
                  failures += 1
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != shard["sha256"]:
                  print(f"::error::sha256 mismatch for {path}: {actual} != {shard['sha256']}")
                  failures += 1
              else:
                  print(f"[verify] {shard['name']}: {shard['rows']} rows, sha256 ok")
          if failures:
              sys.exit(1)
          print(f"[verify] all {len(qa['shards'])} shards certified")
          PY

      - name: QA report
        run: |
          echo "=== processing QA (data/qa/processing.json) ==="
          python -m json.tool data/qa/processing.json | head -120

      - name: Upload processing QA + shard manifests (data never leaves as data)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: processing-sample-qa
          path: |
            data/qa/
            data/manifests/
          if-no-files-found: error

      - name: Disk after
        run: df -h /
