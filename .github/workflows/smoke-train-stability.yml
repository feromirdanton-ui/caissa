name: smoke-train-stability
# Deep lane #3 (session-0013): does ANY configuration of the v2 family converge?
# The F0-F4 factorial is config flags, not code branches. The decision rule is pre-registered in
# LOG/session-0013-preregistration.md and is not retouched here. All shell logic lives in
# scripts/smoke_train_stability_ci.py (ADR-0009), so this file stays small enough to publish by
# hand (ADR-0012: transcription is only trusted below 2 KB).
on:
  workflow_dispatch:
    inputs:
      lichess_month:
        description: "Lichess month (YYYY-MM)"
        required: false
        default: "2013-01"
      train_positions:
        description: "training positions"
        required: false
        default: "2000"
      shard_size:
        description: "games per shard"
        required: false
        default: "10000"
concurrency:
  group: smoke-train-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: The F0-F4 stability factorial (data -> shards -> converge? -> metrics)
        env:
          MONTH: ${{ inputs.lichess_month }}
          TRAIN_POSITIONS: ${{ inputs.train_positions }}
          SHARD_SIZE: ${{ inputs.shard_size }}
        run: python scripts/smoke_train_stability_ci.py all
      - name: Upload metrics + forensics + shard QA
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: smoke-train-stability-metrics
          path: data/qa/
          if-no-files-found: warn
