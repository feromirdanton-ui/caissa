name: smoke-train-v2

# Deep lane #2 (ADR-0011, session 0008): scale the «Vertical». The clean runner pulls the honest
# day-prefix, shards it, then trains the v2 configuration on REAL games and runs BOTH micro-ablations
# from the same shards and the same split seed. It uploads the metrics and the ablation deltas as
# artifacts. Data and weights never enter git (Article 8) — `data/**` is ignored by path and the
# clone guard below enforces it.
#
# The decision rule lives in LOG/session-0008-preregistration.md and was committed BEFORE this run:
#   SUCCESS top-1 >= 0.30 · DEAD <= baseline · INCONCLUSIVE in between · INVALID if legality < 100%.
# It is not retouched here. A negative result is recorded with the same care as a positive one.

on:
  workflow_dispatch:
    inputs:
      lichess_month:
        description: "Lichess month to sample (YYYY-MM)"
        required: false
        default: "2013-01"
      train_positions:
        description: "Training positions to load from the shards"
        required: false
        default: "40000"
      shard_size:
        description: "games per shard"
        required: false
        default: "10000"

concurrency:
  group: smoke-train-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vertical-v2:
    name: scaled vertical (data → shards → train v2 → metrics + ablations)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Clone guard — data must never be tracked
        run: |
          bad=$(git ls-files -i -c --exclude-standard)
          if [ -n "$bad" ]; then
            echo "::error::tracked files are ignored by .gitignore:"
            echo "$bad"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the working tree is dirty before the run:"
            git status --porcelain
            exit 1
          fi

      - name: Pull the day prefix (real Lichess games, resumable, sha256-certified)
        env:
          MONTH: ${{ inputs.lichess_month }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          from caissa.acquisition.lichess_bulk import LICHESS_STANDARD, download_prefix

          cfg = yaml.safe_load(Path("configs/data-sample.yaml").read_text())
          month = os.environ["MONTH"]
          target = Path("data/raw/lichess") / f"lichess_day_{month}.pgn.zst"
          res = download_prefix(LICHESS_STANDARD.format(month=month), target, int(cfg["lichess_prefix_bytes"]))
          print(f"[data] {res.prefix_bytes} B prefix sha256={res.sha256[:16]}… resumed_from={res.resumed_from}")
          PY

      - name: Shard the prefix (stream → filter → dedup → jsonl.zst + QA)
        run: |
          python -m caissa.processing.cli \
            data/raw/lichess/lichess_day_${{ inputs.lichess_month }}.pgn.zst \
            --out data/shards --qa data/qa/processing.json \
            --shard-size ${{ inputs.shard_size }} --truncated-ok

      - name: Verify every shard sha256 against the file on disk
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          qa = json.loads(Path("data/qa/processing.json").read_text())
          failures = 0
          for shard in qa["shards"]:
              path = Path("data/shards") / shard["name"]
              if not path.exists():
                  print(f"::error::shard missing: {path}"); failures += 1; continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != shard["sha256"]:
                  print(f"::error::sha256 mismatch for {path}"); failures += 1
              else:
                  print(f"[verify] {shard['name']}: {shard['rows']} rows, sha256 ok")
          if failures:
              sys.exit(1)
          print(f"[verify] all {len(qa['shards'])} shards certified")
          PY

      - name: Override the position budget from the dispatch input
        env:
          TRAIN_POSITIONS: ${{ inputs.train_positions }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path("configs/smoke-train-v2.yaml").read_text())
          cfg["max_train_positions"] = int(os.environ["TRAIN_POSITIONS"])
          Path("configs/smoke-train-v2.ci.yaml").write_text(yaml.safe_dump(cfg))
          print("effective train positions:", cfg["max_train_positions"])
          PY

      - name: smoke-train-v2 on the real shards (main + both ablations)
        run: |
          python -m caissa.training.smoke_train_v2 --config configs/smoke-train-v2.ci.yaml
        env:
          PYTHONUNBUFFERED: "1"

      - name: Metrics (main run)
        run: python -m json.tool data/qa/metrics-v2.json

      - name: Ablations (deltas versus the main run)
        run: python -m json.tool data/qa/ablations-v2.json

      - name: Post the verdict to the run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          main = json.loads(Path("data/qa/metrics-v2.json").read_text())
          abl = json.loads(Path("data/qa/ablations-v2.json").read_text())
          m = main["model"]
          print("## smoke-train-v2 — the scaled vertical")
          print()
          print(f"- **verdict**: `{main['verdict']['status']}` — {main['verdict']['reason']}")
          print(f"- val loss: {m['val_loss_first']:.4f} → {m['val_loss_last']:.4f}")
          print(f"- top-1: {m['top1_accuracy']:.4f} vs baseline {main['baseline']['val_accuracy']:.4f}")
          print(f"- legality: {main['legality']['legal']}/{main['legality']['sampled']} (top-1, distinct positions)")
          print(f"- data: {main['data']['train_games']} train / {main['data']['val_games']} val games, "
                f"{main['data']['train_samples']} train samples (K={main['config']['history']})")
          print()
          print("### ablations (pre-registered questions in LOG/session-0008-preregistration.md)")
          print()
          print("| ablation | top-1 | Δ vs main | verdict |")
          print("|---|---|---|---|")
          for a in abl["ablations"]:
              print(f"| {a['label']} | {a['model']['top1_accuracy']:.4f} | "
                    f"{a['delta_top1_vs_main']:+.4f} | {a['verdict']['status']} |")
          PY

      - name: Upload metrics + ablations + shard QA
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: smoke-train-v2-metrics
          path: |
            data/qa/metrics-v2.json
            data/qa/ablations-v2.json
            data/qa/processing.json
          if-no-files-found: error

      - name: Disk after
        run: df -h /
