name: smoke-train-v2

# Deep lane #2 (ADR-0011): scale the <<Vertical>>. The clean runner pulls the honest day-prefix,
# shards it, then trains the RELOADED v2 config on REAL games and runs both micro-ablations from
# the same shards and the same split seed. Metrics and ablation deltas are uploaded as artifacts;
# data/** is ignored by path and the clone guard below enforces it (Article 8 -- weights and data
# never enter git).
#
# The decision rule lives in LOG/session-0010-preregistration.md and was committed BEFORE this run:
#   SUCCESS top-1 >= 0.30 * DEAD <= the SET-LOCAL baseline * INCONCLUSIVE in between.
#   INVALID if ANY loss/metric is non-finite (the instrument is destroyed) OR legality < 100%.
# It is not retouched here. A negative result is recorded with the same care as a positive one.
#
# The shell logic lives in scripts/smoke_train_v2_ci.py, not inline: an ~8 KB YAML kept arriving at
# the API with a differing blob sha, while every smaller file published byte-identically (ADR-0009).

on:
  workflow_dispatch:
    inputs:
      lichess_month:
        description: "Lichess month to sample (YYYY-MM)"
        required: false
        default: "2013-01"
      train_positions:
        description: "Training positions to load from the shards"
        required: false
        default: "2000"
      shard_size:
        description: "games per shard"
        required: false
        default: "10000"

concurrency:
  group: smoke-train-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vertical-v2:
    name: scaled vertical (data -> shards -> train v2 -> metrics + ablations)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Clone guard -- data must never be tracked
        run: |
          bad=$(git ls-files -i -c --exclude-standard)
          if [ -n "$bad" ]; then
            echo "::error::tracked files are ignored by .gitignore:"; echo "$bad"; exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the working tree is dirty before the run:"; git status --porcelain; exit 1
          fi

      - name: Pull the day prefix (real Lichess games, resumable, sha256-certified)
        env:
          MONTH: ${{ inputs.lichess_month }}
        run: python scripts/smoke_train_v2_ci.py fetch-prefix

      - name: Shard the prefix (stream -> filter -> dedup -> jsonl.zst + QA)
        env:
          MONTH: ${{ inputs.lichess_month }}
          SHARD_SIZE: ${{ inputs.shard_size }}
        run: python scripts/smoke_train_v2_ci.py shard

      - name: Verify every shard sha256 against the file on disk
        run: python scripts/smoke_train_v2_ci.py verify-shards

      - name: Override the position budget from the dispatch input
        env:
          TRAIN_POSITIONS: ${{ inputs.train_positions }}
        run: python scripts/smoke_train_v2_ci.py override

      - name: smoke-train-v2 on the real shards (main + both ablations)
        run: python -m caissa.training.smoke_train_v2 --config configs/smoke-train-v2.ci.yaml
        env:
          PYTHONUNBUFFERED: "1"

      - name: Divergence guard -- a FAILURE artifact must fail the run
        run: python scripts/smoke_train_v2_ci.py guard

      - name: Verdict summary
        run: python scripts/smoke_train_v2_ci.py summary

      - name: Upload metrics + ablations + shard QA
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: smoke-train-v2-metrics
          path: |
            data/qa/metrics-v2.json
            data/qa/ablations-v2.json
            data/qa/processing.json
            data/qa/summary.md
          if-no-files-found: error

      - name: Disk after
        run: df -h /
