# main — the full being (1–3B params). 8×A100+ reference target.
scale: main
params: "1-3B"
model:
  d_model: 2048
  n_heads: 16
  n_layers: 24
  max_seq_len: 512
training:
  batch_size: 32
  lr: 1.5e-4
  warmup_steps: 5000
  checkpoint_every: 500
  amp: true
  flash_attention: true
  fsdp: true  # STUB — see src/caissa/training/distributed.py
data: data/shards
