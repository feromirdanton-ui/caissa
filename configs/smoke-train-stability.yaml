# smoke-train-stability -- the F0-F4 fix factorial (session-0013, deep lane: divergence diagnosis).
#
# Session-0012 established THAT the v2 family diverges (val loss 3.35 -> 25.2, grad norm 4.8 -> 648)
# but not WHY. Session-0013's question is narrower and answerable: does ANY configuration of the v2
# family converge at all? The duel with v1 is NOT run here -- a configuration earns the right to a
# rematch by converging first, under its own pre-registration (0014).
#
# Every fix is a CONFIG FLAG, never a code branch: the same training loop, the same model class, the
# same eval set. That is what makes the factorial a controlled comparison rather than five programs.
#
#   F0  base            -- the control; expected to diverge (reproduces session-0012)
#   F1  grad clip       -- global-norm clipping at max_grad_norm (a symptom dampener)
#   F2  cosine logits   -- bounded logits (removes the divergence's CAUSE: unbounded bilinear heads)
#   F3  optimizer       -- SGD at 0.01 (the stable range session-0009 found), no Adam
#   F4  F1 + F2         -- clip AND cosine logits together
#
# The decision rule is pre-registered in LOG/session-0013-preregistration.md, committed BEFORE the
# run: CONVERGES = final val loss < first AND grad norm never exceeds 10x its first AND legality
# 100%; DIVERGES = final val loss > 2x the best; anything between is recorded as facts, not a verdict.
# Moving any of it after seeing the metrics is exactly the retouching ADR-0011 section 5 forbids.
#
# Weights are a disposable run artifact -- never a git object (Article 8).

scale: small
lane: deep
shards: data/shards
metrics: data/qa/metrics-stability.json
ablations_out: data/qa/ablations-stability.json

history: 8
window_history: 8

plateau_patience: 5
plateau_eps: 0.0001
min_evals: 6
max_epochs: 20

model:
  name: numpy_history
  d_model: 256
  n_heads: 8
  geometric_bias: true

val_fraction: 0.05
seed: 0
max_positions_to_load: 200000
max_train_positions: 60000
max_val_positions: 10000
budget_minutes: 90

# F0's optimizer: Adam at the session-0011 rate. The fixes below override it where they must.
optimizer: adam
lr: 0.005
betas: [0.9, 0.999]
alpha: 0.05

v1_reference: false      # no duel this session -- the question is convergence, not beating v1
v1_lr: 0.05

guard_every: 200
sample_moves: 1000
progress_marker: 0.30

# Session-0013: a divergence is the ANSWER to "does this fix converge?", so the factorial records
# it as DIVERGES and continues to the other fixes.
tolerate_divergence: true
# The F0 control is PRE-REGISTERED to diverge (it reproduces session-0012) -- its divergence is the
# predicted behaviour, not a failure. Any OTHER cell diverging is unexpected and reddens the run.
expected_divergence: [d256_k8]

# The F0-F4 factorial. F0 is the main run (d256@K8, unchanged); F1-F4 are the fixes.
configurations:
  - name: F1_grad_clip
    overrides:
      max_grad_norm: 1.0        # global-norm clip; recorded BEFORE the shot
  - name: F2_cosine_logits
    overrides:
      model:
        logit_norm: true
        logit_scale: 8.0
  - name: F3_sgd_0p01
    overrides:
      optimizer: sgd
      lr: 0.01                  # the stable range session-0009 found for this family
  - name: F4_clip_and_cosine
    overrides:
      max_grad_norm: 1.0
      model:
        logit_norm: true
        logit_scale: 8.0
