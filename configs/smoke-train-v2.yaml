# smoke-train-v2 -- the convergence duel (session-0011; scaled in session-0008, reloaded in 0010).
#
# v1 (`configs/smoke-train.yaml`) proved the composition on real games with K=0 and a linear head.
# The v2 family asks whether more capacity AND move history raise top-1 move accuracy, and then
# attributes the change to an organ by ablation from the SAME shards and the SAME split seed.
#
# Session-0011 changes the MEASUREMENT INSTRUMENT, not the model family: every configuration trains
# to its OWN plateau (session-0010 used a fixed step count, which judges the stopwatch rather than
# the players), one recorded optimizer replaces SGD, and every delta is tested with McNemar on the
# same eval set.
#
# The decision rule is NOT invented here. It is pre-registered in LOG/session-0011-preregistration.md,
# committed BEFORE the run: SUCCESS = at least one configuration beats v1@set with McNemar p < 0.05;
# DEAD = nothing beats v1; INCONCLUSIVE = above v1 but not significant, or a ceiling before plateau;
# INVALID = any non-finite metric or legality < 100%. `progress_marker: 0.30` is reported but never
# decides the verdict. Moving any of it after seeing the metrics is exactly the retouching ADR-0011
# section 5 forbids.
#
# Weights are a disposable run artifact -- never a git object (Article 8).

scale: small
lane: deep
shards: data/shards
metrics: data/qa/metrics-v2.json
ablations_out: data/qa/ablations-v2.json

history: 8               # K: the last 8 boards before the current one, encoded by a shared encoder
# The eval set is built ONCE with this K and shared by every configuration, so a component's
# contribution is a controlled difference on the SAME positions (session-0009 preflight). A
# configuration with a smaller K reads only the suffix of that same window -- it changes the model's
# input, never the set it is measured on.
window_history: 8

plateau_patience: 5      # stop after 5 consecutive val-loss evaluations with no improvement
plateau_eps: 0.0001      # an improvement must beat the best by MORE than this (absolute)
min_evals: 6             # patience cannot fire before 6 evaluations (a lucky epoch 1 is not a limit)
max_epochs: 20           # the HARD ceiling; hitting it without a plateau is INCONCLUSIVE, stated

model:
  name: numpy_history
  d_model: 256           # v1 was 128 -> 256
  n_heads: 8             # heads at the same proportion to d_model as v1 (128/4)
  geometric_bias: true   # kept ON for all four cells: geometry was ablated in session-0010, and
                         # re-ablating it here would confound this session's capacity/history axis

val_fraction: 0.05       # split BY GAME, so no game straddles train and val
seed: 0
max_positions_to_load: 200000
max_train_positions: 60000   # declared, not hidden
max_val_positions: 10000     # the session-0011 eval set (session-0010 used 400: too small to test)
budget_minutes: 90           # the runner constraint, stated rather than silently truncated

# One recorded optimizer choice, made BEFORE the shot (LOG/session-0011-preregistration.md section 3):
# the `0.05` (v1 stable) vs `0.005` (v2 stable) gap of session-0009 is the price of a badly
# conditioned objective, not evidence of lower capacity. Adam normalizes per-parameter step length,
# so ONE lr is meaningful across the family and the comparison stops depending on the schedule.
optimizer: adam
lr: 0.005
betas: [0.9, 0.999]
alpha: 0.05              # the significance level for every McNemar comparison

v1_reference: true       # retrain v1 (tiny) to ITS OWN plateau in the same run, scored on BOTH sets
v1_lr: 0.05              # v1 keeps its own optimizer (sgd) and stable rate -- lr is part of the price

guard_every: 200         # the NaN guard also checks parameter finiteness every N steps
sample_moves: 1000       # the Article 1 gate: these must be 100% legal
progress_marker: 0.30    # a progress marker, NOT a gate (session-0011 section 6)

# The frozen 2x2 of the v2 family: {d_model 128,256} x {K 0,8}. The main run above is d256@K8; these
# three close the factorial. Each answers a question written down in advance, and a negative answer
# is a result: the map of which organ contributes is built from honest zeros.
configurations:
  - name: d128_k8          # the capacity axis at fixed history
    overrides:
      model:
        d_model: 128
        n_heads: 4
  - name: d256_k0          # the history axis at fixed capacity (window stays at 8)
    overrides:
      history: 0
      window_history: 8
  - name: d128_k0          # closes the factorial
    overrides:
      history: 0
      window_history: 8
      model:
        d_model: 128
        n_heads: 4
